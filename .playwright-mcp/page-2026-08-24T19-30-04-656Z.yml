        - heading "The one trick worth this whole day" [level=3] [ref=f1e161]
        - paragraph [ref=f1e162]: Competitors' UGC ads are a list of people already cast in AI-companion creative and cleared for that specific paid use.
        - paragraph [ref=f1e163]: "Open Meta Ad Library, search Talkie or Character.ai, and look at the faces. Every talking-head ad is a performer someone already found, cast, and cleared for that ad. Find their handle (it's often visible in the video or the caption), and they go straight into your pipeline as warm: they have delivered this format and understand paid rights. Their permission does not transfer to us, and the library does not prove performance, so ask again and judge the work yourself. It is still one of the highest-yield free sourcing channels."
        - heading "The weekly ritual" [level=3] [ref=f1e164]
        - list [ref=f1e165]:
          - listitem [ref=f1e166]: "Every Monday, 30 minutes: open the ad libraries for our five competitors."
          - listitem [ref=f1e167]: Screenshot any new UGC ad (you'll recognize repeats fast).
          - listitem [ref=f1e168]: "Log per ad: the hook (first line spoken), the setting, the claimed benefit, the creator's handle if findable."
          - listitem [ref=f1e169]: Add new creators to the tracker with status found and source ad library.
          - listitem [ref=f1e170]: Send Nat the three most interesting hooks. She turns hooks into briefs.
