        - generic [ref=f1e274]:
          - heading "The mass-DM box. Read this once, believe it forever." [level=4] [ref=f1e275]
          - paragraph [ref=f1e276]: Instagram lets you send a first message. It does not give you a licence to contact the same person repeatedly for commercial purposes without consent. The official messaging API starts after the person messages the professional account; browser bots get around that boundary by pretending to be you. That is exactly why we do not use them.
          - paragraph [ref=f1e277]: "The rules that keep us safe: never automate DMs from the Replika brand account. Your scout account sends hand-written, relevant DMs to people whose work you actually watched. If someone does not engage, stop. Anything that needs blasting belongs in a marketplace, an opt-in application surface or a properly run email campaign, not a fake-human bot."
        - heading "Platform-by-platform, first week moves" [level=3] [ref=f1e278]
        - list [ref=f1e279]:
          - listitem [ref=f1e280]: "Fiverr: search \"UGC video app\", filter to your brief's country, sort by reviews. Message 10 with the brief. Sellers are there to be hired, so this is a clean place to learn the loop."
          - listitem [ref=f1e281]: "Insense or Billo: ask Dmytro which we have a seat on. Post one brief, let applications come in overnight. These platforms front-load the boring parts (contracts, rights, payment)."
          - listitem [ref=f1e282]: "TikTok One: filter creators by country + age + category, inspect recent engagement in context, then invite to the brief inside the platform. There is no magic percentage."
          - listitem [ref=f1e283]: "Facebook groups: join five, read the pinned rules (some want a rate stated, some ban \"gifted only\"), post the brief with a real budget range. A real budget filters out pointless back-and-forth."
          - listitem [ref=f1e284]: "Instagram, manually: search the niche, open a creator, watch two videos fully (you will reference one in the DM). Only then write. Ten of these a day, forever."
          - listitem [ref=f1e285]: "Email: collect the bio emails of everyone you shortlisted this week. One personalized paragraph, the brief attached as one page. Email is where follow-ups live too."
        - heading "Three profiles, annotated" [level=3] [ref=f1e286]
        - paragraph [ref=f1e287]: "Take the cozy brief from graduation. Here is how it reads three real-shaped profiles:"
        - generic [ref=f1e288]:
          - heading "practice profile · the yes · @mira.days" [level=4] [ref=f1e289]
          - paragraph [ref=f1e290]: Cozy day-in-my-life vlogs, talks to camera in most posts. Bio says "ugc creator" with an email. Portfolio link shows two previous app promos. Comments answered, roughly 4% engagement.
          - paragraph [ref=f1e291]: "Why she's first: the bio email means business-ready, the app promos mean she already knows rights talk, and her format already reads native. Ask her rate and turnaround instead of inventing either."
        - generic [ref=f1e292]:
          - heading "practice profile · the tempting no · @sofialumiere" [level=4] [ref=f1e293]
          - paragraph [ref=f1e294]: Gorgeous grid, silent aesthetic transitions, luxury tags. Engagement 0.4%. The bio email goes to an agency.
          - paragraph [ref=f1e295]: "Why you skip: the format is wrong (no face-to-camera speech anywhere), and the agency adds weeks while anchoring price to an audience we are not buying. Beautiful is a different job than the brief's. Log her as closed · format mismatch so future-you remembers."
        - generic [ref=f1e296]:
          - heading "practice profile · the hidden gem · @debspiralling" [level=4] [ref=f1e297]
          - paragraph [ref=f1e298]: Posts to camera daily, reviews "apps that keep me sane", warm and a little chaotic, zero UGC branding anywhere.
          - paragraph [ref=f1e299]: "Why she's worth a message: fewer buyers will find her through a \"UGC creator\" search, and she already makes app content in exactly our register. Ask her rate instead of guessing it. Reliability is unknown, so the first deal stays small. The handles in these three cards are simulations; the judgment is the exercise."
