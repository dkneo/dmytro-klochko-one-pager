        - paragraph [ref=f1e372]: "For every post, save the link, account, format, hook and publish time. At 24 hours and again at 7 days, record the metrics the account actually exposes: views, average watch time, completion rate, shares, saves, comments, follows and profile visits. Compare posts on the same account and similar time window. One large view count cannot explain why it happened. The job is to turn a pattern into the next test and hand it back to the creator or motion designers."
        - heading "When you are the creator" [level=3] [ref=f1e373]
        - list [ref=f1e374]:
          - listitem [ref=f1e375]: Write three opening lines. Keep the body the same so the hook is the variable.
          - listitem [ref=f1e376]: Shoot vertical on the phone. Face a window, clean the lens and check the audio before the full take.
          - listitem [ref=f1e377]: Record each opening separately, then two complete takes. Pause before and after every line so motion designers have room to cut.
          - listitem [ref=f1e378]: Keep the raw files. Name the hook, setting and date. Send the strongest take plus the alternatives, not a mystery camera roll.
          - listitem [ref=f1e379]: Post only after the account owner approves the caption, link and disclosure. Then run the same 24-hour and 7-day loop.
