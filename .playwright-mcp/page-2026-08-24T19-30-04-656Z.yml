        - heading "The money logic" [level=3] [ref=f1e47]
        - paragraph [ref=f1e48]: "Replika grows by buying ads on Meta and TikTok. Ten years ago the skill in buying ads was targeting: choosing who sees them. The platforms automated much of that away. Today the algorithm decides a lot of who sees an ad, which makes the creative itself one of the strongest remaining levers. Different videos find different people: a cozy girl-talking-to-camera video finds one audience, a lonely-late-night confession finds another."
        - paragraph [ref=f1e49]: Creative is the new targeting. The variety of videos we can test decides who we can reach, and you control the input to that machine.
        - paragraph [ref=f1e50]: Studio ads look like ads and get scrolled past. Videos shot by real people on phones look like the feed itself, so they earn the first two seconds. That is a major reason UGC (user-generated content, in practice creator-made native video) exists as an industry.
        - heading "What happens to a video you source" [level=3] [ref=f1e51]
        - generic "the pipeline" [ref=f1e52]:
          - generic [ref=f1e53]: you find a creator
          - generic [ref=f1e54]: →
          - generic [ref=f1e55]: brief + deal
          - generic [ref=f1e56]: →
          - generic [ref=f1e57]: they shoot raw video
          - generic [ref=f1e58]: →
          - generic [ref=f1e59]: editors cut 5–15 ad variants
          - generic [ref=f1e60]: →
          - generic [ref=f1e61]: variants tested with small budgets
          - generic [ref=f1e62]: →
          - generic [ref=f1e63]: winners get real spend
        - paragraph [ref=f1e64]: "One good creator delivering raw footage becomes many ads. Winners can also run from the creator's own account with paid budget behind them: on TikTok this is called Spark Ads, on Meta partnership ads (people say \"whitelisting\"). An ad from @realgirl can outperform the same ad from @replika because it reads as a recommendation, not a promotion. It is not automatic: the hook and the creator still have to work. This is why the deal you negotiate should cover ad usage rights, not just a post."
        - heading "What this means for you" [level=3] [ref=f1e65]
        - list [ref=f1e66]:
          - listitem [ref=f1e67]: Volume beats polish. Five okay creators shipping monthly beat one perfect influencer posting once. The goal is a stable of eight to ten reliable people.
          - listitem [ref=f1e68]: Fit beats followers. A creator with 900 followers who talks to camera like a best friend can be worth more to us than 500k followers of silent aesthetic clips. Paid distribution carries the video, so judge the performance first.
          - listitem [ref=f1e69]: Rights are part of the deal. If paid usage is unavailable, the creator can still be good at organic content but wrong for this brief. Ask early and agree the duration.
          - listitem [ref=f1e70]: Speed compounds. Fast replies keep warm creators warm. Slow replies create more follow-up work and give another brand time to move first.
        - figure [ref=f1e71]:
