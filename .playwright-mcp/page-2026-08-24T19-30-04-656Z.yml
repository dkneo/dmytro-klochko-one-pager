          - listitem [ref=f1e608]: Shoot one UGC video yourself. Record three hooks and two full takes on the phone. Keep the raw files, choose one cut and write the caption you would publish. If an account is ready, post or schedule it and add the 24-hour and 7-day metric checks to your calendar.
